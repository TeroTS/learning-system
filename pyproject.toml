[project]
name = "learning-system"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
